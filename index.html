<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pet Feeder Dashboard</title>
  <meta name="description" content="Monitoring nafsu makan & penjadwalan automatic pet feeder">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" aria-label="Navigasi utama">
      <div class="brand">
        <div class="brand-logo" data-icon="paw"></div>
        <div>
          <div class="brand-name">PawFeeder</div>
          <div class="brand-sub">Monitoring nafsu makan</div>
        </div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-foot">
        <button class="btn btn-ghost" id="themeBtn" type="button"></button>
        <div class="user-chip">
          <div class="avatar" id="userAvatar">?</div>
          <div style="min-width:0;flex:1">
            <div class="email" id="userEmail">—</div>
            <a class="tiny" href="login.html">Keluar</a>
          </div>
        </div>
      </div>
    </aside>

    <main class="main" id="view" tabindex="-1"></main>
  </div>

  <nav class="mobile-nav" id="mobileNav" aria-label="Navigasi"></nav>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <div id="modalRoot"></div>

  <script src="js/severity.js"></script>
  <script src="js/mock-data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
